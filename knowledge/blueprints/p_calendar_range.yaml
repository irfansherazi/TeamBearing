# knowledge/blueprints/p_calendar_range.yaml
#
# Recipe: p_calendar_range
#
# Handles PrimeNG p-calendar in range selection mode as used in the vSuite
# Production Orders date filter, Quick Order date pickers, and report date ranges.
#
# ────────────────────────────────────────────────────────────────────────────────
# WHY THIS RECIPE EXISTS (Component-Agnostic Design proof-of-concept)
# ────────────────────────────────────────────────────────────────────────────────
# This YAML proves that the recipe engine in recipe_runner.py is a generic
# translation layer. It handles a completely different component (p-calendar)
# using completely different action types (fill, press_key, click) with no
# Python code changes. Dropping this file into knowledge/blueprints/ is all
# that is required.
#
# PrimeNG p-calendar in range mode renders two date inputs tied to the same
# calendar overlay. The Angular model binds to formControl or ngModel and
# accepts typed dates — no visual clicking of calendar cells required.
# This recipe types directly into the input fields for speed and determinism.
#
# ────────────────────────────────────────────────────────────────────────────────
# DOM STRUCTURE (from productionorders.component.html / p-calendar Angular usage)
# ────────────────────────────────────────────────────────────────────────────────
#
# <p-calendar [selectionMode]="range" [showIcon]="true" formControlName="dateRange">
#   <input class="p-calendar-input" placeholder="mm/dd/yyyy" .../>
#   <!-- range mode: second click sets the end date in the same input -->
# </p-calendar>
#
# In range mode with showIcon=true:
#   - The calendar icon button opens the overlay panel.
#   - The INPUT inside p-calendar accepts typed dates: MM/DD/YYYY format.
#   - Typing the start date + Tab opens range end entry.
#   - Pressing Escape dismisses without committing.
#   - The calendar overlay closes automatically after both dates are entered.
#
# ────────────────────────────────────────────────────────────────────────────────
# DATE FORMAT RULES
# ────────────────────────────────────────────────────────────────────────────────
#
#   start_date and end_date MUST be in MM/DD/YYYY format.
#   Examples: "04/01/2026", "12/31/2025"
#   The allowed_pattern enforces this format to prevent Playwright fill errors.
#
# ────────────────────────────────────────────────────────────────────────────────
# CHOOSING container_selector
# ────────────────────────────────────────────────────────────────────────────────
#
#   If the page has ONE p-calendar:
#     container_selector: "p-calendar"
#   If the page has MULTIPLE p-calendars (start date + end date separate pickers):
#     Use the formControlName or a parent selector:
#     container_selector: "[formControlName='scheduledStartDate'] p-calendar"
#     container_selector: ".date-range-filter p-calendar"
#   If using a label-based association:
#     Use get_by_label in sub-step 2 instead of container_selector scoping.
#
# ────────────────────────────────────────────────────────────────────────────────
# HITL PARAMETERIZATION NOTE (Rule 5)
# ────────────────────────────────────────────────────────────────────────────────
#
#   If a human manually selects dates "04/01/2026" and "04/30/2026" during a
#   HITL takeover, those hardcoded values MUST be parameterized before promoting
#   to this blueprint. The LLM parameterization step replaces the literal dates
#   with $start_date and $end_date before saving to /components/.
#   Raw click sequences (clicking calendar cells) cannot be promoted at all —
#   only fill-based sequences qualify for auto-promotion.
#
# ────────────────────────────────────────────────────────────────────────────────
# TEST DATA API BACKDOOR NOTE (Rule 6)
# ────────────────────────────────────────────────────────────────────────────────
#
#   Production Orders filtered by date range require existing POs in the system.
#   These should be seeded via the API backdoor (POST /api/production-orders)
#   before this recipe runs, not created via UI workflow.
#   This recipe ONLY sets the date filter — it does not create test data.

name: p_calendar_range
description: >
  PrimeNG p-calendar in range selection mode — types start and end dates directly
  into the calendar input fields. Faster and more deterministic than clicking
  calendar cells. Handles single-input range mode (one input, two dates) and
  two-input mode (separate start/end inputs). Closes overlay via Tab+Escape.

# is_sort_recipe is false (default) — no oscillation pre-check needed.
# This recipe does not set is_sort_recipe, demonstrating that the pre-check
# hook is component-specific and does NOT affect non-sort recipes.

trigger_keywords:
  # Date range input keywords
  - "date range"
  - "date filter"
  - calendar
  - "start date"
  - "end date"
  - "due date"
  - "from date"
  - "to date"
  - "p-calendar"
  - "date picker"
  - "scheduled"
  - "filter by date"
  # Action verbs
  - pick
  - select
  - "enter date"
  - "set date"
  - range
  - filter

parameters:
  - name: container_selector
    description: >
      CSS selector for the p-calendar component or its parent container.
      Used to scope both sub-steps to the correct calendar on the page.
      Examples:
        "p-calendar"                                      (single calendar)
        ".date-range-filter p-calendar"                  (scoped by parent)
        "[formControlName='scheduledStartDate']"          (by Angular control)
        ".p-calendar-input"                               (direct input)
    allowed_pattern: "^[\\w\\s\\.\\-\\#\\[\\]=:\\/\\(\\)\\&,\\^\\*\\+]+$"

  - name: start_date
    description: >
      Start date in MM/DD/YYYY format. This is typed directly into the
      p-calendar input field. Must be a valid calendar date.
      Example: "04/01/2026"
    # Strict date pattern: MM/DD/YYYY only.
    # No free-form input — prevents injection and Playwright fill errors.
    allowed_pattern: '^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])\/\d{4}$'

  - name: end_date
    description: >
      End date in MM/DD/YYYY format. Must be >= start_date.
      Example: "04/30/2026"
    allowed_pattern: '^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])\/\d{4}$'

steps:
  # Sub-step 1: Click the calendar icon to open the overlay panel.
  # This ensures keyboard focus is inside the calendar component before typing.
  # Uses css_selector scoped to the container so it won't match calendar icons
  # from other date fields on the same page.
  - action: click
    strategy: css_selector
    # p-calendar renders a span.p-calendar-icon or button.p-datepicker-trigger
    selector: $container_selector .p-datepicker-trigger, $container_selector .p-calendar-icon, $container_selector button[icon*="calendar"]
    wait_after_ms: 600   # PrimeNG overlay open animation: ~300-500ms

  # Sub-step 2: Clear the existing value and type the start date.
  # fill() first clears the field (equivalent to triple-click + type).
  # In range mode this sets the range start; Angular binds it to the formControl.
  - action: fill
    strategy: css_selector
    selector: $container_selector input.p-calendar-input, $container_selector input[placeholder*="mm/dd"]
    value: $start_date
    wait_after_ms: 300   # Allow Angular CD to register the start date

  # Sub-step 3: Press Tab to advance focus to the end date field (range mode).
  # In PrimeNG range mode (selectionMode="range"), Tab after the start date
  # either advances to the end date input OR keeps focus in the same input
  # waiting for the second date click. Either way, subsequent fill targets
  # the end date entry point.
  - action: press_key
    key: Tab
    wait_after_ms: 200

  # Sub-step 4: Type the end date.
  # In single-input range mode, this appends to the date range (MM/DD/YYYY - MM/DD/YYYY).
  # In two-input mode, this fills the second input field identified by :nth-of-type(2).
  # The fill targets the active input inside the calendar overlay or the second input.
  - action: fill
    strategy: css_selector
    selector: $container_selector input.p-calendar-input:last-of-type, $container_selector input[placeholder*="mm/dd"]:last-of-type
    value: $end_date
    wait_after_ms: 300

  # Sub-step 5: Press Enter to commit the date range and close the overlay.
  # PrimeNG p-calendar commits on Enter and dispatches the (onSelect) event.
  # If the overlay doesn't close (showIcon=true, closeOnSelect=false), the
  # cleanup_on_failure Escape would handle it — but normal flow closes here.
  - action: press_key
    key: Enter
    wait_after_ms: 800   # Wait for Angular form update + optional API filter call

cleanup_on_failure:
  # If any sub-step fails (overlay not opened, fill rejected, etc.),
  # dismiss the calendar overlay and restore focus to the page body.
  - action: press_key
    key: Escape
    wait_after_ms: 400
  # Second Escape handles nested overlays (e.g., month/year selector open within calendar)
  - action: press_key
    key: Escape
    wait_after_ms: 200

# Post-recipe verification: confirm one of the inputs shows the start date text.
# This is a DOM text check (element_visible with selector scoped to the input)
# — not a Vision LLM call, not a screenshot assertion.
# The start_date check is sufficient proof that the date range was accepted.
# For production assertions, the AC step verifier handles deeper validation
# (e.g., table rows filtered to the date range).
verify_after:
  type: element_visible
  # Verify the calendar input now shows the start_date value by checking the
  # aria-label or the input value. Using a partial text selector is most robust.
  selector: "$container_selector input[value*='$start_date'], $container_selector .p-calendar-input"
