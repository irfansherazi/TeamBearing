; ──────────────────────────────────────────────────────────────────
; vQA — Supervisord Configuration
; ──────────────────────────────────────────────────────────────────
;
; Supervisord manages four processes inside the Docker container:
;
;   1. Xvfb          — Virtual X11 framebuffer (DISPLAY=:99)
;   2. x11vnc        — VNC server exposing the Xvfb display
;   3. websockify    — WebSocket-to-VNC proxy for noVNC
;   4. uvicorn       — FastAPI backend (the vQA API)
;
; Process startup order:
;   Xvfb starts first (priority=10) because x11vnc needs DISPLAY=:99.
;   x11vnc starts second (priority=20) to expose the display.
;   websockify starts third (priority=30) for noVNC browser access.
;   uvicorn starts last (priority=40) after all infra is ready.
;
; In headless mode (VQA_MODE=headless):
;   Xvfb, x11vnc, and websockify are NOT used — only uvicorn runs.
;   Override this file with docker-compose.ci.yml which sets
;   the entrypoint to just uvicorn.
; ──────────────────────────────────────────────────────────────────

[supervisord]
; Run in foreground (required for Docker — supervisord IS PID 1)
nodaemon=true
; Log to stdout for Docker log aggregation
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
; Write the pidfile to a writable location
pidfile=/tmp/supervisord.pid

; ──────────────────────────────────────────────────────────────────
; Process 1: Xvfb — Virtual X11 Display
; ──────────────────────────────────────────────────────────────────
; Creates a virtual display at DISPLAY=:99 with 1920x1080 resolution
; and 24-bit colour depth.  Playwright renders Chromium into this
; display in interactive (headed) mode.
;
; Screen format: width x height x depth
; +extension GLX: enables OpenGL (not strictly needed, but prevents
; some Chromium warnings)

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 +extension GLX
priority=10
autostart=true
autorestart=true
; Xvfb is silent unless there's an error
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Give Xvfb 3 seconds to start before launching dependent processes
startsecs=3

; ──────────────────────────────────────────────────────────────────
; Process 2: x11vnc — VNC Server
; ──────────────────────────────────────────────────────────────────
; Connects to DISPLAY=:99 and serves a VNC stream.  noVNC
; (via websockify) connects to this to provide browser-based access.
;
; Flags:
;   -display :99    → the Xvfb display to mirror
;   -nopw           → no VNC password (internal container only)
;   -forever        → don't exit when last client disconnects
;   -shared         → allow multiple concurrent VNC viewers
;   -rfbport 5900   → standard VNC port

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport 5900
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Wait for Xvfb to be ready
startsecs=2
; x11vnc needs DISPLAY set
environment=DISPLAY=":99"

; ──────────────────────────────────────────────────────────────────
; Process 3: websockify — WebSocket-to-VNC Bridge
; ──────────────────────────────────────────────────────────────────
; Bridges WebSocket clients (noVNC in the browser) to the x11vnc
; VNC server.  This is what makes the live browser stream accessible
; from the React dashboard via an iframe.
;
; Port mapping:
;   6080 (WebSocket) → 5900 (VNC)
;
; The --web flag serves the noVNC HTML/JS client files, so users
; can open http://host:6080/vnc.html directly.

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=2

; ──────────────────────────────────────────────────────────────────
; Process 4: uvicorn — FastAPI Backend
; ──────────────────────────────────────────────────────────────────
; The main vQA API server.  Runs with:
;   --host 0.0.0.0      → bind to all interfaces (Docker networking)
;   --port 8000          → standard API port
;   --workers 1          → single worker (Playwright is not fork-safe)
;   --log-level info     → match the app's LOG_LEVEL setting
;
; IMPORTANT: Playwright browser contexts are NOT safe to share
; across multiple workers — always run with workers=1.  Concurrency
; is handled via asyncio within the single worker.

[program:uvicorn]
command=/usr/local/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1 --log-level info
directory=/app
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
; Graceful shutdown: send SIGTERM (→ uvicorn → lifespan → _drain_all_managers)
; then wait 15s for browser cleanup before force-killing.
stopsignal=TERM
stopwaitsecs=15
; Pass PYTHONPATH so uvicorn can resolve the application modules. It will naturally inherit the container-level DISPLAY variable.
environment=PYTHONPATH="/app"
